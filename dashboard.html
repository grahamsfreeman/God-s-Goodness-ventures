<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>God's Goodness Venture Admin</title>

<link rel="stylesheet" href="admin.css">

</head>

<body>

<header class="topbar">

    <h1>God's Goodness Venture</h1>

    <button id="logoutBtn">Logout</button>

</header>

<div class="dashboard">

    <!-- Statistics -->

    <section class="stats">

        <div class="card">

            <h3>Products</h3>

            <h1 id="totalProducts">0</h1>

        </div>

        <div class="card">

            <h3>Reviews</h3>

            <h1 id="totalReviews">0</h1>

        </div>

        <div class="card">

            <h3>Website Visits</h3>

            <h1 id="totalVisits">0</h1>

        </div>

    </section>

    <!-- Product Form -->

    <section class="formSection">

        <h2>Add / Edit Product</h2>

        <form id="productForm">

            <input
                type="text"
                id="productName"
                placeholder="Product Name"
                required>

            <textarea
                id="productDescription"
                placeholder="Description"
                required></textarea>

            <input
                type="text"
                id="productPrice"
                placeholder="Price"
                required>

            <input
                type="file"
                id="productImage"
                accept="image/*">

            <button
                id="saveBtn"
                type="submit">

                Save Product

            </button>

        </form>

    </section>

    <!-- Products -->

    <section>

        <h2>Products</h2>

        <div id="productsList">

            Loading products...

        </div>

    </section>

    <!-- Reviews -->

    <section>

        <h2>Customer Reviews</h2>

        <div id="reviewsList">

            Loading reviews...

        </div>

    </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../supabase.js"></script>

<script src="dashboard.js"></script>

</body>

</html>
