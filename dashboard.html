<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<link rel="stylesheet" href="admin.css">

</head>

<body>

<h1>God's Goodness Venture Dashboard</h1>

<button id="logoutBtn">Logout</button>

<div class="stats">

    <div class="card">
        <h2>Products</h2>
        <h1 id="totalProducts">0</h1>
    </div>

    <div class="card">
        <h2>Reviews</h2>
        <h1 id="totalReviews">0</h1>
    </div>

    <div class="card">
        <h2>Website Visits</h2>
        <h1 id="totalVisits">0</h1>
    </div>

</div>

<hr>

<h2>Add Product</h2>

<form id="productForm">

    <input
        type="text"
        id="productName"
        placeholder="Product Name"
        required>

    <textarea
        id="productDescription"
        placeholder="Description"
        required></textarea>

    <input
        type="text"
        id="productPrice"
        placeholder="Price"
        required>

    <input
        type="file"
        id="productImage"
        accept="image/*"
        required>

    <button type="submit">
        Add Product
    </button>

</form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase.js"></script>
<script src="dashboard.js"></script>

</body>
</html>
